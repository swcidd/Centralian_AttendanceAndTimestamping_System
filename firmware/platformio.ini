; Board: ESP32-S3 N16R8 (16MB flash, 8MB octal PSRAM)
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.psram_type = opi
; USB_MODE=1 comes from the board definition (hardware USB-Serial/JTAG).
; Without CDC_ON_BOOT the Arduino `Serial` object routes to UART0
; (GPIO43/44) instead of the USB port — sketch prints never reach
; `pio device monitor` even though core E/W logs still do.
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    adafruit/Adafruit PN532@^1.3.3
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit NeoPixel@^1.12.0

; Standalone PN532 smoke test: no WiFi/config.h/net/crypto, just
; nfc.cpp read over Serial. For hardware bring-up before config.h
; (WiFi + device secrets) exists. Run: pio run -e nfc-test -t upload -t monitor
; build_flags override drops -DBOARD_HAS_PSRAM so the monitor isn't
; spammed with "PSRAM ID read error" while debugging the NFC bus.
[env:nfc-test]
extends = env:esp32-s3-n16r8
; drops only -DBOARD_HAS_PSRAM; keeps USB CDC so sketch prints are visible
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<main.cpp> -<net.cpp> -<crypto.cpp> -<time_sync.cpp> -<validation.cpp> -<led.cpp> -<commands.cpp> -<i2c_scan_main.cpp>

; Full online pipeline but prints signed payload to Serial instead
; of POSTing. Verifies WiFi + NTP + NFC + HMAC before the backend
; exists. Run: pio run -e net-test -t upload -t monitor
[env:net-test]
extends = env:esp32-s3-n16r8
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<*> -<net.cpp> -<i2c_scan_main.cpp> -<nfc_test_main.cpp>

; Raw I2C bus scanner: lists every ACKing address each 2s cycle.
; PN532 healthy = 0x24. Run: pio run -e i2c-scan -t upload -t monitor
[env:i2c-scan]
extends = env:esp32-s3-n16r8
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = +<i2c_scan_main.cpp>
