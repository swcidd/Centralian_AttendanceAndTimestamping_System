; Board: ESP32-S3 N16R8 (16MB flash, 8MB octal PSRAM)
[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200

board_build.flash_size = 16MB
board_build.psram_type = opi
build_flags =
    -DBOARD_HAS_PSRAM

lib_deps =
    adafruit/Adafruit PN532@^1.3.3
    bblanchon/ArduinoJson@^7.0.0
    adafruit/Adafruit NeoPixel@^1.12.0

; Standalone PN532 smoke test: no WiFi/config.h/net/crypto, just
; nfc.cpp read over Serial. For hardware bring-up before config.h
; (WiFi + device secrets) exists. Run: pio run -e nfc-test -t upload -t monitor
[env:nfc-test]
extends = env:esp32-s3-n16r8
build_src_filter = +<*> -<main.cpp> -<net.cpp> -<crypto.cpp> -<time_sync.cpp> -<validation.cpp> -<led.cpp>
